<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Match-3 Puzzle</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Segoe UI', system-ui, sans-serif;
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #score {
        position: fixed;
        top: env(safe-area-inset-top, 16px);
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 1.4rem;
        font-weight: 700;
        text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        pointer-events: none;
        z-index: 10;
        padding-top: 8px;
        white-space: nowrap;
      }
      #best-score {
        position: fixed;
        top: env(safe-area-inset-top, 16px);
        left: 50%;
        transform: translateX(-50%);
        color: #f1c40f;
        font-size: 0.9rem;
        font-weight: 600;
        text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        pointer-events: none;
        z-index: 10;
        padding-top: 40px;
        white-space: nowrap;
      }
      #dev-replay {
        position: fixed;
        bottom: env(safe-area-inset-bottom, 16px);
        right: 16px;
        background: #3498db;
        color: white;
        border: none;
        padding: 10px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        z-index: 10;
        transition: background 0.2s;
        display: none;
      }
      #dev-replay:hover {
        background: #2980b9;
      }
      #dev-replay.show {
        display: block;
      }
      /* Landscape overlay — ask player to rotate */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        background: #1a1a2e;
        color: #fff;
        font-size: 1.2rem;
        font-weight: 600;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        z-index: 100;
        text-align: center;
        padding: 2rem;
      }
      #rotate-hint svg {
        width: 60px;
        height: 60px;
        opacity: 0.7;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-hint { display: flex; }
      }
      #game-over {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(26, 26, 46, 0.95);
        color: #fff;
        font-size: 2.5rem;
        font-weight: 700;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2rem;
        z-index: 100;
        text-align: center;
        padding: 2rem;
      }
      #game-over.show {
        display: flex;
      }
      #game-over button {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 32px;
        font-size: 1.2rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
      }
      #game-over button:hover {
        background: #2980b9;
      }
    </style>
  </head>
  <body>
    <div id="score">Score: 0</div>
    <div id="best-score"></div>
    <button id="dev-replay" onclick="window.replayAt05x()">Replay @0.25x</button>
    <div id="app"></div>
    <div id="game-over">
      <div>Game Over</div>
      <button onclick="location.reload()">Play Again</button>
    </div>
    <div id="rotate-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="5" y="2" width="14" height="20" rx="2"/>
        <path d="M12 18h.01"/>
      </svg>
      Please rotate your device to portrait mode
    </div>
    <script>
      // Show replay button in dev mode (localhost or ?dev=1)
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || new URLSearchParams(location.search).get('dev') === '1') {
        document.getElementById('dev-replay').classList.add('show');
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
